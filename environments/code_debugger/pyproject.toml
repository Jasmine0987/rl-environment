[project]
name = "code-debugger"
version = "0.1.0"
description = "Multi-turn agentic environment: fix a buggy Python function using a code-execution tool, graded by running hidden unit tests."
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.0",
    "datasets>=2.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["code_debugger.py"]

[tool.hatch.metadata]
allow-direct-references = true
